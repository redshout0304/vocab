    <style>
             :root {
    --admin-panel-width: min(500px, 96vw); /* 계정관리 창 가로 너비 — 핸드폰에서 화면 밖 삐져나오지 않게 */
    --admin-panel-max-height: 80vh;        /* 계정관리 창 최대 세로 높이 */
--mode-card-width: 230px;             /* 모드 카드 가로 너비 */
    --mode-card-height: 360px;            /* 모드 카드 세로 높이 */
}
/* LED 막대 깜빡임 애니메이션 — 연한 보라 ↔ 진한 보라 반복 */
@keyframes ledPulse {
    0%   { opacity: 0.3; }
    50%  { opacity: 1; }
    100% { opacity: 0.3; }
}
/* LED 막대 공통 스타일 — 기본 숨김 */
.led-bar {
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: #a78bfa;
    animation: ledPulse 1.5s ease-in-out infinite;
    display: none; /* 기본 숨김 — 스크롤 감지 시 표시 */
    flex-shrink: 0; /* LED바 높이 찌그러지지 않게 고정 */
    background-color: white; /* 리스트와 겹치지 않게 배경 분리 */
    position: relative; /* LED바가 리스트 위에 뜨지 않게 흐름 유지 */
    z-index: 1; /* 리스트보다 위에 표시 */
}

/* 핸드폰 화면(500px 이하) — 관리자 패널 내부 크기 축소 */
@media (max-width: 500px) {
    /* 패널 내부 여백 축소 */
    #admin-panel > div {
        padding: 16px 12px; /* 기존 32px → 핸드폰에서 16px 12px로 축소 */
    }
    /* 패널 제목 폰트 축소 */
    #admin-panel h3 {
        font-size: 14px; /* 기존 17px → 14px */
    }
    /* 승인요청/승인된계정 헤드 폰트 축소 */
    #admin-pending-title,
    #admin-approved-title {
        font-size: 11px; /* 기존 13px → 11px */
        padding: 4px 8px; /* 기존 6px 10px → 4px 8px */
    }
    /* 목록 row 안 폰트/버튼 축소 — grid 칸 비율도 핸드폰에 맞게 재조정 */
    #admin-pending-list .admin-row,
    #admin-user-list .admin-row {
        grid-template-columns: 0.5fr 1.6fr 1.6fr 1.6fr 0.6fr 0.6fr; /* 칸 비율 축소 */
        gap: 4px; /* 기존 6px → 4px */
        font-size: 11px; /* 기존 12~13px → 11px */
    }
}
/* 승인요청 목록 스크롤 영역 — 스크롤바 숨김 + row 단위 스냅 */
#admin-pending-list {
    scrollbar-width: none; /* Firefox 스크롤바 숨김 */
    -ms-overflow-style: none; /* IE 스크롤바 숨김 */
    scroll-snap-type: y mandatory; /* y축 방향으로 row 단위 딱딱 이동 */
}
#admin-pending-list::-webkit-scrollbar {
    display: none; /* Chrome/Safari 스크롤바 숨김 */
}

/* 승인된 계정 목록 스크롤 영역 — 스크롤바 숨김 + row 단위 스냅 */
#admin-user-list {
    scrollbar-width: none; /* Firefox 스크롤바 숨김 */
    -ms-overflow-style: none; /* IE 스크롤바 숨김 */
    scroll-snap-type: y mandatory; /* y축 방향으로 row 단위 딱딱 이동 */
}
#admin-user-list::-webkit-scrollbar {
    display: none; /* Chrome/Safari 스크롤바 숨김 */
}/* 수정요청 팝업 오버레이 */

/* 수정요청 버튼 영역 */

/* 수정요청 요청 버튼 */

/* 수정요청 취소 버튼 */

<!-- ==================== 전역변수 + JS ==================== -->
<script>
    const ADMIN_PASSWORD = "0000";
    let currentUser = null;

    function db() { return window._db; }
    function fsDoc(...a) { return window._fsDoc(...a); }
    function fsSetDoc(...a) { return window._fsSetDoc(...a); }
    function fsGetDoc(...a) { return window._fsGetDoc(...a); }
    function fsGetDocs(...a) { return window._fsGetDocs(...a); }
    function fsCollection(...a) { return window._fsCollection(...a); }
    function fsDeleteDoc(...a) { return window._fsDeleteDoc(...a); }

/* 회원가입 */
    async function doSignup() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username || !password) { showLoginError('아이디와 비밀번호를 입력해주세요.'); return; }
        if (password.length < 6) { showLoginError('비밀번호는 6자 이상이어야 합니다.'); return; }
        try {
            const userDoc = await fsGetDoc(fsDoc(db(), "vocab_users", username));
            if (userDoc.exists()) {
                showLoginError('이미 사용 중인 아이디입니다.');
            } else {
                await fsSetDoc(fsDoc(db(), "vocab_users", username), {
                    pw: password,
                    approved: false,
                    date: new Date().toLocaleString('ko-KR')
                });
                showLoginError('회원가입 요청이 완료되었습니다. 관리자 승인 후 로그인 가능합니다.');
            }
        } catch(e) {
            showLoginError('회원가입 실패: ' + e.message);
        }
    }

/* 로그인 */
    async function doLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        if (!username || !password) { showLoginError('아이디와 비밀번호를 입력해주세요.'); return; }
        try {
            const userDoc = await fsGetDoc(fsDoc(db(), "vocab_users", username));
            if (!userDoc.exists()) { showLoginError('아이디 또는 비밀번호가 올바르지 않습니다.'); return; }
            const userData = userDoc.data();
            if (String(userData.pw) !== String(password)) { showLoginError('아이디 또는 비밀번호가 올바르지 않습니다.'); return; }
            if (userData.approved !== true) { showLoginError('아직 관리자 승인이 되지 않은 계정입니다.'); return; }
            /* role 포함해서 저장 — admin이면 words.html, student면 study.html로 분기 */
currentUser = { uid: username, displayName: username, role: userData.role || 'student' };
localStorage.setItem('vocabCurrentUser', JSON.stringify(currentUser)); /* 파일 간 이동해도 유지되도록 localStorage 사용 */
hideLoginScreen();
        } catch(e) {
            showLoginError('로그인 실패: ' + e.message);
        }
    }

/* 관리자 패널 표시 */
   async function showAdminPanel() {
    const panel = document.getElementById('admin-panel');
    panel.style.display = 'flex';

    /* 승인요청 목록 영역 */
    const pendingList = document.getElementById('admin-pending-list');
    /* 승인된 계정 목록 영역 */
    const approvedList = document.getElementById('admin-user-list');

    pendingList.innerHTML = '<p style="color:#7c2d12; font-size:13px;">불러오는 중...</p>';
    approvedList.innerHTML = '';

    try {
        /* 가입요청(vocab_users) + 수정요청(changeRequests) 동시 로드 */
        const [userSnapshot, changeSnapshot] = await Promise.all([
            fsGetDocs(fsCollection(db(), "vocab_users")),
            fsGetDocs(fsCollection(db(), "changeRequests"))
        ]);

        pendingList.innerHTML = '';
        const pendingUsers = [];
        const approvedUsers = [];
        const changeRequests = [];

        /* 가입요청 분류 */
        userSnapshot.forEach(docSnap => {
            const data = docSnap.data();
            if (data.approved === true) approvedUsers.push({ id: docSnap.id, ...data });
            else pendingUsers.push({ id: docSnap.id, ...data });
        });

        /* 수정요청 분류 — pending 상태만 */
        changeSnapshot.forEach(docSnap => {
            const data = docSnap.data();
            if (data.status === 'pending') changeRequests.push({ docId: docSnap.id, ...data });
        });

        /* 승인요청 헤드 — 고정 div에 건수만 업데이트 */
        const totalPending = pendingUsers.length + changeRequests.length;
        document.getElementById('admin-pending-title').innerText = `⏳ 승인 요청 (${totalPending}건)`;

        if (totalPending === 0) {
            /* 대기 요청 없을 때 안내 문구 */
            const empty = document.createElement('p');
            empty.style.cssText = 'color:#8c7e72; font-size:13px; margin:4px 0 10px 0;';
            empty.innerText = '대기 중인 요청이 없습니다.';
            pendingList.appendChild(empty);
        } else {
                       /* 가입요청 목록 표시 — 승인요청 스크롤 영역에 추가 */
            pendingUsers.forEach(user => {
                               /* [가입요청 row] — 미디어쿼리 적용 대상 */
                const row = document.createElement('div');
                row.className = 'admin-row';
                row.style.cssText = 'display:grid; grid-template-columns:0.7fr 2fr 2fr 2fr 0.65fr 0.65fr; align-items:center; gap:6px; padding:8px 0; border-bottom:1px solid #f5efe6; width:100%; scroll-snap-align:start;'; /* scroll-snap — 이 row 위쪽 기준으로 딱 멈춤 */
                row.innerHTML = `
                    <!-- 태그 칸 — grid 1번째 칸 -->
                    <span style="font-size:11px; font-weight:bold; background:#dbeafe; color:#1d4ed8; padding:2px 4px; border-radius:6px; white-space:nowrap; text-align:center;">가입</span>
                    <!-- 아이디 칸 — grid 2번째 칸 -->
                    <span style="font-size:13px; font-weight:bold; color:#4a3b32; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">👤 ${user.id}</span>
                    <!-- 비번 칸 — grid 3번째 칸 -->
                    <span style="font-size:12px; color:#9a3412; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${user.pw || ''}</span>
                    <!-- 역할 칸 — grid 4번째 칸 -->
                    <span class="pending-role-toggle" data-id="${user.id}" data-role="student"
                        style="font-size:11px; font-weight:bold; padding:3px 8px; border-radius:10px; white-space:nowrap; text-align:center; cursor:pointer; background:#dcfce7; color:#166534;">🎓 학생</span>
                    <!-- 승인 버튼 — grid 5번째 칸 -->
                    <button onclick="adminApproveUser('${user.id}', this.previousElementSibling)"
                        style="padding:4px 0; background:#22c55e; color:white; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; white-space:nowrap; text-align:center;">승인</button>
                    <!-- 거절 버튼 — grid 6번째 칸 -->
                    <button onclick="if(confirm('${user.id} 가입 요청을 거절하시겠습니까?')) fsDeleteDoc(fsDoc(db(),'vocab_users','${user.id}')).then(()=>this.closest('div').remove())"
                        style="padding:4px 0; background:#ef4444; color:white; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; white-space:nowrap; text-align:center;">거절</button>`;
                pendingList.appendChild(row);
            });

            /* 수정요청 목록 표시 — 승인요청 스크롤 영역에 추가 */
            changeRequests.forEach(req => {
                const changeDesc = [
                    req.newId ? `아이디→${req.newId}` : '',
                    req.newPw ? `비번→${req.newPw}` : ''
                ].filter(Boolean).join(' / ');

                                             /* [수정요청 row] — 미디어쿼리 적용 대상 */
                const row = document.createElement('div');
                row.className = 'admin-row';
                row.style.cssText = 'display:grid; grid-template-columns:0.7fr 2fr 2fr 2fr 0.65fr 0.65fr; align-items:center; gap:6px; padding:8px 0; border-bottom:1px solid #f5efe6; width:100%; scroll-snap-align:start;'; /* scroll-snap — 이 row 위쪽 기준으로 딱 멈춤 */
                row.innerHTML = `
                    <!-- 태그 칸 — grid 1번째 칸 -->
                    <span style="font-size:11px; font-weight:bold; background:#fef9c3; color:#854d0e; padding:2px 4px; border-radius:6px; white-space:nowrap; text-align:center;">수정</span>
                    <!-- 아이디 칸 — grid 2번째 칸 -->
                    <span style="font-size:13px; font-weight:bold; color:#4a3b32; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">👤 ${req.uid}</span>
                    <!-- 변경내용 칸 — grid 3~4번째 칸 병합 -->
                    <span style="grid-column:3/5; font-size:12px; color:#9a3412; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${changeDesc}</span>
                    <!-- 승인 버튼 — grid 5번째 칸 -->
                    <button onclick="adminApproveChange('${req.docId}', '${req.uid}', '${req.newId}', '${req.newPw}')"
                        style="padding:4px 0; background:#f59e0b; color:white; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; white-space:nowrap; text-align:center;">승인</button>
                    <!-- 거절 버튼 — grid 6번째 칸 -->
                    <button onclick="if(confirm('${req.uid} 수정 요청을 거절하시겠습니까?')) fsDeleteDoc(fsDoc(db(),'changeRequests','${req.docId}')).then(()=>this.closest('div').remove())"
                        style="padding:4px 0; background:#ef4444; color:white; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; white-space:nowrap; text-align:center;">거절</button>`;
                pendingList.appendChild(row);
            });
        }

        roleSpan.style.pointerEvents = '';

}
/* 관리자 - 수정요청 승인 — 아이디/비번 변경 후 요청 문서 상태 완료로 업데이트 */
async function adminApproveChange(docId, uid, newId, newPw) {
    const changeDesc = [newId ? `아이디→${newId}` : '', newPw ? `비번→${newPw}` : ''].filter(Boolean).join(', ');
    if (!confirm(`'${uid}'의 수정요청을 승인하시겠습니까?\n(${changeDesc})`)) return;

    try {
        const updateData = {};
        /* 새 아이디가 있으면 — 기존 문서 복사 후 새 아이디로 재생성, 기존 문서 삭제 */
        if (newId) {
            const oldDoc = await fsGetDoc(fsDoc(db(), "vocab_users", uid));
            const oldData = oldDoc.data();
            /* 새 아이디 문서 생성 */
            await fsSetDoc(fsDoc(db(), "vocab_users", newId), {
                ...oldData,
                pw: newPw || oldData.pw   /* 비번도 바꾸면 같이 반영 */
            });
            /* 기존 아이디 문서 삭제 */
            await fsDeleteDoc(fsDoc(db(), "vocab_users", uid));
        } else if (newPw) {
            /* 비번만 변경 */
            await fsSetDoc(fsDoc(db(), "vocab_users", uid), { pw: newPw }, { merge: true });
        }

        /* 수정요청 문서 상태 → 완료 */
        await fsSetDoc(fsDoc(db(), "changeRequests", docId), { status: 'done' }, { merge: true });

        alert('수정 승인이 완료되었습니다.');
        showAdminPanel();   /* 패널 새로고침 */

    } catch(e) {
        alert('수정 승인 실패: ' + e.message);
    }
}

window.adminApproveChange = adminApproveChange;

/* 수정요청 팝업 열기 — 로그인 화면의 기존 아이디/비번 확인 후 진입 */
async function openChangeRequest() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    /* 아이디/비번 미입력 시 안내 */
    if (!username || !password) {
        showLoginError('수정 요청 전 현재 아이디와 비밀번호를 입력해주세요.');
        return;
    }

    /* Firestore에서 기존 아이디/비번 확인 */
    try {
        const userDoc = await fsGetDoc(fsDoc(db(), "vocab_users", username));
        if (!userDoc.exists()) { showLoginError('아이디 또는 비밀번호가 올바르지 않습니다.'); return; }
        const userData = userDoc.data();
        if (String(userData.pw) !== String(password)) { showLoginError('아이디 또는 비밀번호가 올바르지 않습니다.'); return; }

        /* 확인 완료 → 팝업 표시 */
        document.getElementById('changeRequestOverlay').style.display = 'flex';
        document.getElementById('cr-new-id').value = '';
        document.getElementById('cr-new-pw').value = '';

    } catch(e) {
        showLoginError('오류: ' + e.message);
    }
}

/* 수정요청 팝업 닫기 */
function closeChangeRequest() {
    document.getElementById('changeRequestOverlay').style.display = 'none';
}

/* 수정요청 제출 — Firestore changeRequests 컬렉션에 저장 */
async function submitChangeRequest() {
    const username = document.getElementById('login-username').value.trim();
    const newId = document.getElementById('cr-new-id').value.trim();
    const newPw = document.getElementById('cr-new-pw').value;

    /* 아이디/비번 둘 다 미입력 시 안내 */
    if (!newId && !newPw) {
        alert('변경할 아이디 또는 비밀번호를 입력해주세요.');
        return;
    }

    /* Firestore changeRequests 컬렉션에 요청 저장 */
    try {
        await fsSetDoc(fsDoc(db(), "changeRequests", username + '_' + Date.now()), {
            uid: username,                          /* 요청한 사용자 아이디 */
            newId: newId || '',                     /* 바꿀 아이디 (없으면 빈값) */
            newPw: newPw || '',                     /* 바꿀 비번 (없으면 빈값) */
            status: 'pending',                      /* 요청 상태: 대기중 */
            date: new Date().toLocaleString('ko-KR')
        });

        closeChangeRequest();
        alert('수정 요청이 완료되었습니다.\n관리자 승인 후 반영됩니다.');

    } catch(e) {
        alert('요청 실패: ' + e.message);
    }
}

window.openChangeRequest = openChangeRequest;
window.closeChangeRequest = closeChangeRequest;
window.submitChangeRequest = submitChangeRequest;

    });

<!-- 관리자 패널 -->
<div id="admin-panel" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:999999; justify-content:center; align-items:center;">
    <div style="background:white; border-radius:14px; border:1px solid #e8dfd8; box-shadow:0 8px 32px rgba(0,0,0,0.15); padding:32px; width:var(--admin-panel-width); height:var(--admin-panel-max-height); display:flex; flex-direction:column; gap:0;">

        <!-- 패널 제목 + 닫기 버튼 — 항상 고정 -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
            <h3 style="margin:0; color:#7c2d12; font-size:17px;">🔐계정 관리</h3>
            <button onclick="closeAdminPanel()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#8c7e72;">×</button>
        </div>

                <!-- 승인요청 섹션 wrapper — 헤드+LED+목록을 하나의 독립 블록으로 묶어 높이 고정 -->
        <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
            <!-- 승인 요청 헤드 — 고정 (스크롤 영역 밖) -->
            <div id="admin-pending-title" style="font-size:13px; font-weight:bold; color:#9a3412; background:#ffedd5; padding:6px 10px; border-radius:4px; margin-bottom:4px; flex-shrink:0;"></div>
            <!-- LED 위쪽 막대 — 승인요청 목록 위 -->
            <div id="led-top" class="led-bar"></div>
            <!-- 승인 요청 목록만 스크롤 — scroll-padding-top으로 첫 row가 LED 뒤에 숨지 않게 -->
            <div id="admin-pending-list" style="overflow-y:auto; flex:1; min-height:40px; scroll-padding-top:4px;"></div>
            <!-- LED 아래쪽 막대 — 승인요청 목록 아래 -->
            <div id="led-bottom" class="led-bar"></div>
        </div>

        <!-- 두 섹션 사이 구분선 -->
        <div style="height:1px; background:#e8dfd8; margin:8px 0; flex-shrink:0;"></div>

        <!-- 승인된계정 섹션 wrapper — 헤드+LED+목록을 하나의 독립 블록으로 묶어 높이 고정 -->
        <div style="flex:1; min-height:0; display:flex; flex-direction:column;">
            <!-- 승인된 계정 헤드 — 고정 (스크롤 영역 밖) -->
            <div id="admin-approved-title" style="font-size:13px; font-weight:bold; color:#1d4ed8; background:#dbeafe; padding:6px 10px; border-radius:4px; margin-bottom:4px; flex-shrink:0;"></div>
            <!-- LED 위쪽 막대 — 승인된 계정 목록 위 -->
            <div id="led-approved-top" class="led-bar"></div>
            <!-- 승인된 계정 목록만 스크롤 — scroll-padding-top으로 첫 row가 LED 뒤에 숨지 않게 -->
            <div id="admin-user-list" style="overflow-y:auto; flex:1; min-height:40px; scroll-padding-top:4px;"></div>
            <!-- LED 아래쪽 막대 — 승인된 계정 목록 아래 -->
            <div id="led-approved-bottom" class="led-bar"></div>
        </div>

    </div>
</div><!-- 메인 앱 (허브) -->
<div id="main-app" style="display:none;">
    <div class="hub-container">
        <div class="hub-title">📚 암기카드 시스템</div>
        <button class="hub-btn" onclick="goToWords()">📝 단어 학습</button>
        <!-- 추후 문장, 한글 버튼 추가 가능 -->
        <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
</div>

</body>
</html>
