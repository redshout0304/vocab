                   --stat-bar-height: 20px;       /* 통계 박스 바 전체 높이 */

          --record-modal-width: 700px;
          --record-modal-max-width: 95%;
                        --shared-modal-width: 600px;   /* 공용파일 모달 가로 */
            --shared-modal-height: 80vh;   /* 공용파일 모달 세로 */
            --shared-card-height: 34px;    /* 공용파일 카드 세로 높이 */
            --ws-font-en: 16px;            /* 화면 영어 글자 크기 */
            --ws-font-kr: 17.5px;            /* 화면 한국어 글자 크기 */
            --ws-font-p: 12px;             /* 화면 페이지 글자 크기 */


        }
/* 공통 기본 스타일 */
        * { box-sizing: border-box; }
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0; padding: 0;
            background-color: #fdfbf7; color: #4a3b32;
        }

        /* 상단 제어바 레이아웃 */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--topbar-height); background-color: #f5efe6;
            color: #4a3b32; display: flex; align-items: center;
            justify-content: flex-end; padding: 0 30px;
            border-bottom: 2px solid #e8dfd8; z-index: 1000;
        }

        .button-group-container {
            display: flex;
            align-items: center;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(139,92,26,0.15);
        }
        .button-group-container .btn {
            border-radius: 0;
        }
        .button-group-container .file-dropdown-wrapper:first-child .btn {
            border-radius: 6px 0 0 6px;
        }
        .button-group-container .btn:last-child {
            border-radius: 0 6px 6px 0;
        }

        .btn {
            width: 95px; height: 40px; font-size: 13px; font-weight: bold;
            border: none; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 4px; border-radius: 0 !important;
            transition: background-color 0.2s, color 0.2s; padding: 0; text-align: center;
        }

       /* 상단 상태 박스 */
.status-box {

        /* 콘텐츠 영역 */
      .content-area {

/* 공용파일 모달 오버레이 */
.shared-modal-overlay {
    display: none; position: fixed; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.4);
    z-index: 3000; justify-content: center; align-items: center;
}
.shared-modal-overlay.open { display: flex; }
/* 공용파일 모달 박스 — 큰카드+그리드 구조 */
.shared-modal-box {
    background: #fffdf9; border-radius: 12px; padding: 0;
    width: var(--shared-modal-width); height: var(--shared-modal-height);
    max-width: 95vw; max-height: 95vh;
    box-shadow: 0 8px 30px rgba(139,92,26,0.2);
    display: flex; flex-direction: column;
    overflow: hidden; resize: both; min-width: 400px; min-height: 300px;
}
/* 모달 타이틀 */
.shared-modal-title {
    font-size: 16px; font-weight: bold; color: #7c2d12;
    padding: 15px 20px 12px; border-bottom: 1px solid #e8dfd8;
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
/* 학교급 큰카드 선택 영역 */
.shared-grade-area {
    padding: 12px 16px; border-bottom: 1px solid #f0e8e0;
    background: #faf5f0; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
}
/* 큰카드 행 */
.shared-bigcard-row {
    display: flex; gap: 8px;
}
/* 학교급 큰카드 버튼 */
.shared-bigcard {
    flex: 1; border-radius: 10px; padding: 10px 8px; text-align: center;
    cursor: pointer; border: 2px solid transparent;
    display: flex; flex-direction: column; gap: 3px; transition: all 0.15s;
}
.shared-bigcard .sbc-icon { font-size: 20px; }
.shared-bigcard .sbc-name { font-size: 12px; font-weight: bold; }
.shared-bigcard .sbc-count { font-size: 10px; opacity: 0.7; }
.shared-bigcard.elem { background: #dbeafe; color: #1e40af; }
.shared-bigcard.mid  { background: #dcfce7; color: #166534; }
.shared-bigcard.high { background: #fef9c3; color: #854d0e; }
.shared-bigcard.active-elem { background: #fef08a; color: #92400e; border-color: #ca8a04; }
.shared-bigcard.active-mid  { background: #fef08a; color: #92400e; border-color: #ca8a04; }
.shared-bigcard.active-high { background: #fef08a; color: #92400e; border-color: #ca8a04; }
.shared-bigcard.dim { opacity: 0.38; }
/* 하위학년 버튼 행 */
.shared-sub-row {
    /* 고정 높이로 하위버튼 없어도 자리 유지 — 리스트 밀림 방지 */
    display: flex; gap: 6px;
    min-height: 34px;
}.shared-sub-btn {
    flex: 1; padding: 7px 0; border-radius: 8px; font-size: 12px; font-weight: bold;
    border: none; cursor: pointer; text-align: center; transition: all 0.15s;
    background: #f0e8e0; color: #78716c;
}
.shared-sub-btn.on { background: #ca8a04; color: #fff; }
/* 그리드 카드 영역 — 가로 한 줄 flex, 스크롤 없이 휠/키로 이동 */
.shared-modal-body {
    flex: 1; padding: 10px 18px;
    display: flex; flex-direction: column;
    /* overflow:hidden 복구 — visible이 footer를 밀어내는 문제 방지 */
    overflow: hidden; position: relative;
    gap: 0;
}/* 그리드 카드 — 가로 한 줄, 세로폭 변수 기반, 기본 유리 회색 */
.shared-grid-card {
    background: rgba(200, 210, 220, 0.25); /* 반투명 회색 유리 */
    border: 1.5px solid rgba(180, 190, 200, 0.4);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 0 12px; cursor: pointer;
    display: flex; flex-direction: row; align-items: center;
    gap: 8px; transition: all 0.15s;
    width: 100%; flex-shrink: 0;
    height: var(--shared-card-height); /* 세로높이 변수 */
    white-space: nowrap; overflow: hidden;
}/* 카드 목록 스크롤 래퍼 — 스크롤바 숨기고 overflow 차단 */
.shared-card-list {
    flex: 1; display: flex; flex-direction: column;
    /* 가로 visible — outline 잘림 방지 / 세로 hidden — 카드 넘침 차단 유지 */
    gap: 5px; overflow-x: visible; overflow-y: hidden; min-height: 0;
}
/* LED 바 — 위/아래 콘텐츠 있음 표시 */
.shared-led-bar {
    height: 4px; border-radius: 2px;
    background: #e8dfd8; flex-shrink: 0;
    transition: background 0.3s;
}
/* LED 활성 — 어두워졌다 밝아졌다 펄스 */
.shared-led-bar.active {
    animation: shared-led-pulse 1.2s ease-in-out infinite;
}
@keyframes shared-led-pulse {
    0%, 100% { background: #92400e; }
    50%       { background: #fde047; }
}
/* 카드 위로 들어오기 — opacity 제거, 위치만 이동 */
@keyframes sgc-slot-up {
    from { transform: translateY(6px); }
    to   { transform: translateY(0); }
}
/* 카드 아래로 들어오기 — opacity 제거, 위치만 이동 */
@keyframes sgc-slot-down {
    from { transform: translateY(-6px); }
    to   { transform: translateY(0); }
}

/* 슬롯 컨테이너 — overflow 잘라내기 */
.shared-grid-card:hover {
    /* border 두껍게 — overflow:hidden 에 안 잘림 */
    background: rgba(254, 240, 138, 0.55);
    border: 2.5px solid rgba(234, 179, 8, 0.8);
    transition: border-color 0.15s ease, background 0.15s ease;
}
/* already-open 호버 시 초록 배경 유지 */
.shared-grid-card.already-open:hover {
    background: rgba(134, 239, 172, 0.45);
    border: 2.5px solid rgba(134, 239, 172, 0.9);
}
/* 래퍼 호버 시 순번 박스 노란 border */
.sgc-wrap:hover .sgc-num {
    border: 2px solid rgba(234, 179, 8, 0.8);
    background: rgba(234, 179, 8, 0.35);
    color: #92400e;
}
/* 선택 시 초록색 */
.shared-grid-card.selected {
    background: rgba(34, 197, 94, 0.35);
    border: 2.5px solid rgba(22, 163, 74, 0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
/* 래퍼 안 카드가 selected일 때 순번 박스도 초록색 */
.sgc-wrap:has(.shared-grid-card.selected) .sgc-num {
    background: rgba(34, 197, 94, 0.35);
    border: 2px solid rgba(22, 163, 74, 0.8);
    color: #15803d;
}
.shared-grid-card.already-open { background: rgba(134, 239, 172, 0.25); border-color: rgba(134, 239, 172, 0.5); }/* 카드 내부 — 가로 한줄 배치 */
.sgc-top { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.sgc-grade { font-size: 10px; font-weight: bold; background: #fef08a; color: #92400e; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
.sgc-tag   { font-size: 10px; font-weight: bold; color: #7c3aed; background: #f3e8ff; padding: 1px 6px; border-radius: 8px; white-space: nowrap; }
/* 카드 파일명 — 중간 flex:1로 가득 채움 */
.sgc-name { font-size: 12px; font-weight: bold; color: #4a3b32; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shared-grid-card.selected .sgc-name { color: #92400e; }

/* 카드 하단 정보 — 날짜·페이지수 */

.shared-grid-card.selected .sgc-check { opacity: 1; }/* 빈 상태 메시지 */

    grid-column: 1 / -1; text-align: center;

/* 공용파일 모달 열기 — 학년탭 자동 생성 + parseFileName으로 파일명 파싱 표시 */
async function openSharedModal() {
    const modal = document.getElementById('sharedModal');
    const gridArea = document.getElementById('sharedModalList');
    const bigcardRow = document.getElementById('sharedBigcardRow');
    const subRow = document.getElementById('sharedSubRow');
        modal.classList.add('open');
    /* sharedCardList 안에만 메시지 — LED바/카드리스트 구조 유지 */
    const loadingListEl = document.getElementById('sharedCardList');
    if (loadingListEl) loadingListEl.innerHTML = '<div class="shared-empty" style="text-align:center;padding:20px;font-size:13px;color:#c8b8a8;">불러오는 중...</div>';
    bigcardRow.innerHTML = '';
    subRow.innerHTML = '';

    try {
        const col = fsCollection(db(), 'shared', 'tabs', 'list');
        const snap = await fsGetDocs(col);

        /* Firestore 문서 → 레코드 배열 변환 */
        const allRecs = snap.docs.map(function(d) {
            const data = d.data();
            data.docId = d.id;
            return data;
        });

        /* 학년 추출 — grade 필드 → id 마지막 '#' 앞 → fileName '#' 앞 순서 */
        function extractGrade(rec) {
            if (rec.grade) return rec.grade;
            const id = rec.id || '';
            const lastPart = id.slice(id.lastIndexOf('/') + 1);
            const hashIdx = lastPart.indexOf('#');
            if (hashIdx !== -1) return lastPart.slice(0, hashIdx);
            const firstFileName = (rec.fileName || '').split(',')[0].trim();
            const fnHashIdx = firstFileName.indexOf('#');
            if (fnHashIdx !== -1) return firstFileName.slice(0, fnHashIdx);
            return '';
        }

        /* 날짜·시간 추출 — savedAt 우선, 없으면 id에서 파싱 */
        function extractDateTime(rec) {
            const savedAt = rec.savedAt || '';
            if (savedAt) return { date: savedAt.slice(2,10).replace(/-/g,'-'), time: savedAt.slice(11,16) };
            const parts = (rec.id || '').split('/');
            const datePart = (parts[0] || '').replace(/[^0-9]/g,'');
            const timePart = parts[1] || '';
            const date = datePart.length >= 6 ? datePart.slice(0,2)+'-'+datePart.slice(2,4)+'-'+datePart.slice(4,6) : '';
            const time = timePart.length >= 4 ? timePart.slice(0,2)+':'+timePart.slice(2,4) : '';
            return { date, time };
        }

        /* 파일명 추출 — fileName 우선, 없으면 id 마지막 부분 */
        function extractFileName(rec) {
            let fileList = (rec.fileName || '').split(',').map(function(f){ return f.trim(); }).filter(Boolean);
            if (fileList.length === 0 && rec.id) {
                const idParts = rec.id.split('/');
                const last = idParts[idParts.length - 1] || '';
                if (last) fileList = [last];
            }
            return fileList;
        }

        /* 그룹 정의 */
        const groupDefs = [
            { label: '초등', icon: '🌱', subs: ['초1','초2','초3','초4','초5','초6'], cls: 'elem' },
            { label: '중등', icon: '📘', subs: ['중1','중2','중3'], cls: 'mid' },
            { label: '고등', icon: '🎓', subs: ['고1','고2','고3'], cls: 'high' }
        ];

        let activeGroupIdx = null; /* 현재 선택된 그룹 인덱스 */
        let activeSub = null;      /* 현재 선택된 하위 학년 */

                      /* 카드 목록 스크롤 상태 */
        let _sharedOffset = 0;
        let _sharedFiltered = [];
        let _sharedCardHeight = 0; /* 카드 1개 높이 (gap 포함) */
        /* _sharedSelected 는 전역으로 이동 — 이 줄 삭제 */

        /* LED바 상태 업데이트 */
        function updateSharedLed() {
            const ledTop = document.getElementById('sharedLedTop');
            const ledBot = document.getElementById('sharedLedBottom');
            if (ledTop) ledTop.className = 'shared-led-bar' + (_sharedOffset > 0 ? ' active' : '');
            if (ledBot) ledBot.className = 'shared-led-bar' + (_sharedOffset + _sharedVisible() < _sharedFiltered.length ? ' active' : '');
        }

               /* 현재 리스트 영역에 보이는 카드 최대 개수 계산 */
        function _sharedVisible() {
            const listEl = document.getElementById('sharedCardList');
            if (!listEl) return 5;
            /* 카드 높이 미측정 시 — 전체 _sharedFiltered 다 보여줌 */
            if (_sharedCardHeight <= 0) return _sharedFiltered.length || 5;
            return Math.floor(listEl.clientHeight / _sharedCardHeight) || 1;
        }

        /* 카드 목록 렌더링 — offset 기준 */
               function renderSharedCards() {
            const listEl = document.getElementById('sharedCardList');
            if (!listEl) return;
            /* 새 카드를 Fragment에 먼저 만들어두고 한 번에 교체 — 깜빡임 방지 */
            const frag = document.createDocumentFragment();

                       if (_sharedFiltered.length === 0) {
                /* 빈 상태 메시지도 Fragment로 교체 — 일관성 유지 */
                const empty = document.createElement('div');
                empty.className = 'shared-empty';
                empty.style.cssText = 'text-align:center;padding:20px;font-size:13px;color:#c8b8a8;';
                empty.innerText = '해당 학년 파일이 없습니다';
                const emptyFrag = document.createDocumentFragment();
                emptyFrag.appendChild(empty);
                listEl.replaceChildren(emptyFrag);
                updateSharedLed();
                return;
            }

            const vis = _sharedVisible();
            const slice = _sharedFiltered.slice(_sharedOffset, _sharedOffset + vis);

            slice.forEach(function(rec, idx) {
                const alreadyOpen = tabs.some(function(t){ return t.savedId === rec.id; });
                const gradeStr = extractGrade(rec);
                const tag = rec.tag || '';
                const dt = extractDateTime(rec);
                const fileList = extractFileName(rec);
                const firstName = fileList[0] || '-';
                const extraCount = fileList.length - 1;
                const summaryText = extraCount > 0 ? firstName + ' 외 ' + extraCount + '건' : firstName;
                const pageCount = (rec.wsPages || []).length;
                const wordCount = (rec.wsPages || []).reduce(function(sum,p){
                    return sum + (p.rows||[]).filter(function(r){ return r.en||r.kr; }).length;
                }, 0);

                               /* 카드 생성 — 가로 한줄, 학년뱃지 제거, 7항목 1:4:1:1:1:1:1 비율 */
                                              /* 카드+순번을 묶는 래퍼 — sgc-wrap 클래스로 CSS 호버 연동 */
                const cardWrap = document.createElement('div');
                cardWrap.className = 'sgc-wrap';
                cardWrap.style.cssText = 'display:flex;align-items:center;gap:6px;width:100%;flex-shrink:0;';

                /* 카드 바깥 왼쪽 순번 박스 — sgc-num 클래스로 CSS 호버 연동 */
                const numBox = document.createElement('div');
                numBox.className = 'sgc-num';
                                /* background,color 인라인 제거 — CSS 클래스(sgc-num)에서 제어 */
                numBox.style.cssText = 'min-width:22px;max-width:22px;height:22px;font-size:10px;font-weight:700;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;';
                numBox.textContent = _sharedOffset + idx + 1;

                                                             const card = document.createElement('div');
                /* 스크롤 후 selected 복원 — Set에 있으면 selected 클래스 추가 */
                card.className = 'shared-grid-card' + (alreadyOpen ? ' already-open' : '') + (_sharedSelected.has(rec.id) ? ' selected' : '');
                /* rec 데이터 저장 — + 추가 버튼에서 참조 */
                card._rec = rec;
                /* 순번 박스 제외한 나머지 공간 자동으로 채움 — 오른쪽 잘림 방지 */
                card.style.flex = '1';
                /* 카드 글자 — 전체 굵게 */
                const sgcStyle = 'color:#1a1a1a;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                               card.innerHTML =
                    /* 태그 비율 1→1.6 (파일수·페이지수·단어수에서 0.2씩 가져옴) */
                    '<span style="flex:1.6;text-align:center;' + sgcStyle + '">'  + (tag || '-')            + '</span>' +
                    '<span style="flex:4;'                     + sgcStyle + '">'  + summaryText              + '</span>' +
                    '<span style="flex:1;text-align:center;'   + sgcStyle + '">'  + (dt.date || '-')         + '</span>' +
                    '<span style="flex:1;text-align:center;'   + sgcStyle + '">'  + (dt.time || '-')         + '</span>' +
                    '<span style="flex:0.8;text-align:center;' + sgcStyle + '">'  + fileList.length + '파일' + '</span>' +
                    '<span style="flex:0.8;text-align:center;' + sgcStyle + '">'  + pageCount + 'p'          + '</span>' +
                    '<span style="flex:0.8;text-align:center;' + sgcStyle + '">'  + wordCount + '단어'       + '</span>';

                /* 카드 클릭 — selected 토글 + 왼쪽 패널 */
                                                           card.addEventListener('click', function(e) {
                    e.stopPropagation();
                    /* 다중 선택 — 클릭한 카드 selected 토글 + Set에 저장 */
                    if (card.classList.toggle('selected')) {
                        _sharedSelected.add(rec.id);
                    } else {
                        _sharedSelected.delete(rec.id);
                    }

                    /* 왼쪽 패널 — selected 시 열기, 해제 시 닫기 */
                    const leftPanel = document.getElementById('sharedLeftPanel');
                    if (!card.classList.contains('selected')) {
                        if (leftPanel._sourceRow === card) {
                            leftPanel.classList.remove('open');
                            leftPanel._sourceRow = null;
                        }
                        return;
                    }
                    /* 왼쪽 패널 내용 */
                    leftPanel.innerHTML = '';
                    const infoDiv = document.createElement('div');
                    infoDiv.style.cssText = 'padding:10px 12px 8px;border-bottom:1px solid #f5efe6;display:flex;flex-direction:row;gap:6px;flex-shrink:0;';
                    infoDiv.innerHTML =
                        '<div style="flex:1;background:#dbeafe;color:#1d4ed8;font-size:11px;font-weight:bold;border-radius:6px;padding:6px 4px;text-align:center;white-space:nowrap;">📁 ' + fileList.length + ' 파일</div>' +
                        '<div style="flex:1;background:#94a3b8;color:#fff;font-size:11px;font-weight:bold;border-radius:6px;padding:6px 4px;text-align:center;white-space:nowrap;">📄 ' + pageCount + ' 페이지</div>' +
                        '<div style="flex:1;background:#ffedd5;color:#9a3412;font-size:11px;font-weight:bold;border-radius:6px;padding:6px 4px;text-align:center;white-space:nowrap;">📝 ' + wordCount + ' 단어</div>';
                    leftPanel.appendChild(infoDiv);
                    const fileListWrap = document.createElement('div');
                    fileListWrap.style.cssText = 'flex:1;overflow-y:auto;min-height:0;scrollbar-width:none;padding-bottom:60px;';
                    fileList.forEach(function(f) {
                        const fItem = document.createElement('div');
                        fItem.className = 'record-file-panel-item';
                        fItem.innerText = f;
                        fileListWrap.appendChild(fItem);
                    });
                    leftPanel.appendChild(fileListWrap);
                    leftPanel._currentRec = rec;
                    const modalBox = document.querySelector('.shared-modal-box');
                    const modalRect = modalBox.getBoundingClientRect();
                    leftPanel.style.top = modalRect.top + 'px';
                    leftPanel.style.left = (modalRect.left - 288) + 'px';
                    leftPanel.style.height = modalRect.height + 'px';
                    leftPanel._sourceRow = card;
                    leftPanel.classList.add('open');
                    renderSharedRightPanel();
                });
                                               /* 래퍼에 순번+카드 조립 후 frag에 추가 */
                cardWrap.appendChild(numBox);
                cardWrap.appendChild(card);
                frag.appendChild(cardWrap);
            });
            /* 준비된 Fragment를 한 번에 교체 — 삭제→생성 사이 빈 화면 없음 */
            listEl.replaceChildren(frag);

            /* 첫 렌더 후 래퍼 높이 측정 */
            const firstCard = listEl.querySelector('.shared-grid-card');
            if (firstCard) _sharedCardHeight = firstCard.closest('div').offsetHeight + 5; /* gap 5px 포함 */
            updateSharedLed();
        }

                                   /* 스크롤 이동 함수 — 깜빡임 없이 바로 교체 후 애니메이션 */
        function sharedScroll(dir) {
            const max = Math.max(0, _sharedFiltered.length - _sharedVisible());
            const prev = _sharedOffset;
            _sharedOffset = Math.max(0, Math.min(_sharedOffset + dir, max));
            if (_sharedOffset === prev) return; /* 변화 없으면 무시 */
            /* 먼저 새 카드로 교체 — 깜빡임 없음 */
            renderSharedCards();
            /* 교체 후 바로 애니메이션 적용 */
            const listEl = document.getElementById('sharedCardList');
            if (!listEl) return;
                       const animName = dir > 0 ? 'sgc-slot-up' : 'sgc-slot-down';
                       /* 애니메이션은 래퍼(cardWrap) 기준으로 적용 */
            listEl.querySelectorAll('.shared-grid-card').forEach(function(card) {
                const wrap = card.closest('div');
                if (!wrap) return;
                wrap.style.animation = 'none';
                void wrap.offsetWidth; /* reflow */
                wrap.style.animation = animName + ' 0.18s ease-out';
                /* 애니메이션 끝나면 인라인 style 제거 — hover transform이 다시 작동하게 함 */
                wrap.addEventListener('animationend', function() {
                    wrap.style.animation = '';
                }, { once: true });
            });
        }
                /* 마우스휠 이동 — 300ms 쓰로틀로 너무 빠른 연속 이동 방지 */
        let _sharedWheelLock = false;
        gridArea.addEventListener('wheel', function(e) {
            e.preventDefault();
            if (_sharedWheelLock) return; /* 300ms 안에 들어온 휠 입력 무시 */
            _sharedWheelLock = true;
            sharedScroll(e.deltaY > 0 ? 1 : -1);
            setTimeout(function() { _sharedWheelLock = false; }, 300); /* 300ms 후 다시 허용 */
        }, { passive: false });

        /* 키보드 위/아래 이동 */
        if (!gridArea._keyBound) {
            gridArea._keyBound = true;
            document.addEventListener('keydown', function(e) {
                if (!document.getElementById('sharedModal').classList.contains('open')) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); sharedScroll(1); }
                if (e.key === 'ArrowUp')   { e.preventDefault(); sharedScroll(-1); }
            });
        }

        /* 그리드 렌더링 — 학년 기준 필터 후 카드 목록 갱신 */
        function renderGrid(grade) {
            _sharedOffset = 0;
            if (!grade) {
                _sharedFiltered = [];
                const listEl = document.getElementById('sharedCardList');
                if (listEl) {
                    listEl.innerHTML = '<div class="shared-empty" style="text-align:center;padding:20px;font-size:13px;color:#c8b8a8;">학교급과 학년을 선택하세요</div>';
                }
                updateSharedLed();
                return;
            }
            _sharedFiltered = allRecs.filter(function(r){ return extractGrade(r) === grade; });
            renderSharedCards();
        }

        /* 하위학년 버튼 렌더링 */
        function renderSubBtns(group) {
            subRow.innerHTML = '';
            group.subs.forEach(function(sub, si) {
                const btn = document.createElement('button');
                btn.className = 'shared-sub-btn' + (si === 0 ? ' on' : '');
                btn.textContent = sub;
                btn.addEventListener('click', function() {
                    subRow.querySelectorAll('.shared-sub-btn').forEach(function(b){ b.classList.remove('on'); });
                    btn.classList.add('on');
                    activeSub = sub;
                    renderGrid(sub);
                });
                subRow.appendChild(btn);
            });
            /* 첫 번째 하위학년 자동 선택 */
            activeSub = group.subs[0];
            renderGrid(activeSub);
        }

        /* 큰카드 버튼 생성 */
        groupDefs.forEach(function(group, gi) {
            const btn = document.createElement('button');
            btn.className = 'shared-bigcard ' + group.cls;
            /* 해당 학교급 파일 수 계산 */
            const cnt = allRecs.filter(function(r){
                return group.subs.indexOf(extractGrade(r)) !== -1;
            }).length;
            btn.innerHTML =
                '<div class="sbc-icon">' + group.icon + '</div>' +
                '<div class="sbc-name">' + group.label + '</div>' +
                '<div class="sbc-count">' + cnt + '개 파일</div>';
            btn.addEventListener('click', function() {
                if (activeGroupIdx === gi) return; /* 같은 그룹 재클릭 무시 */
                activeGroupIdx = gi;
                /* 큰카드 active/dim 상태 갱신 */
                bigcardRow.querySelectorAll('.shared-bigcard').forEach(function(b, bi) {
                    b.className = 'shared-bigcard ' + groupDefs[bi].cls + (bi === gi ? ' active-' + groupDefs[bi].cls : ' dim');
                });
                renderSubBtns(group);
            });
            bigcardRow.appendChild(btn);
        });

                /* 초기 상태 — sharedCardList 안에만 메시지 표시 */
        const initListEl = document.getElementById('sharedCardList');
        if (initListEl) initListEl.innerHTML = '<div class="shared-empty" style="text-align:center;padding:20px;font-size:13px;color:#c8b8a8;">학교급을 선택하세요</div>';
        renderSharedRightPanel();

    } catch(e) {
        document.getElementById('sharedModalList').innerHTML = '<div class="shared-empty" style="color:#ef4444;">불러오기 실패: ' + e.message + '</div>';
    }
}window.openSharedModal = openSharedModal;
/* 가운데 모달 추가 버튼 — 왼쪽 패널 현재 항목을 오른쪽 패널에 추가 */
function addToSharedRight() {
    /* selected 된 카드 전부 수집 */
    const listEl = document.getElementById('sharedCardList');
    if (!listEl) return;
    const selectedCards = listEl.querySelectorAll('.shared-grid-card.selected');
    if (selectedCards.length === 0) return;

    selectedCards.forEach(function(card) {
        /* 카드에 저장된 rec 데이터 참조 */
        const rec = card._rec;
        if (!rec) return;
        /* 이미 추가된 항목이면 무시 */
        const already = sharedRightItems.some(function(r) { return r.id === rec.id; });
        if (already) return;
        const fileList = (rec.fileName || rec.label || '').split(',').map(function(f) { return f.trim(); }).filter(Boolean);
        const pageCount = (rec.wsPages || []).length;
        /* 단어수 — 내용 있는 행만 카운트 */
        const wordCount = (rec.wsPages || []).reduce(function(sum, p) {
            return sum + (p.rows || []).filter(function(r) { return r.en || r.kr; }).length;
        }, 0);
               sharedRightItems.push({ id: rec.id, rec: rec, fileList: fileList, pageCount: pageCount, wordCount: wordCount });
    });

    /* 추가 후 selected 전부 해제 + Set 초기화 */
    selectedCards.forEach(function(card) { card.classList.remove('selected'); });
    _sharedSelected.clear();
    renderSharedRightPanel();
}window.addToSharedRight = addToSharedRight;
/* 공용파일 오른쪽 패널 렌더링 — 선택 항목 누적 표시 */
function renderSharedRightPanel() {
    const rightPanel = document.getElementById('sharedRightPanel');
    const modalBox = document.querySelector('.shared-modal-box');
    if (!modalBox) return;
    const modalRect = modalBox.getBoundingClientRect();

    /* 오른쪽 패널 위치 — 모달 오른쪽에 고정 */
    rightPanel.style.top = modalRect.top + 'px';
    rightPanel.style.left = (modalRect.right + 8) + 'px';
    rightPanel.style.height = modalRect.height + 'px';

    rightPanel.innerHTML = '';

    /* 누적 통계 계산 */
    const totalFile = sharedRightItems.reduce(function(sum, r) { return sum + r.fileList.length; }, 0);
    const totalPage = sharedRightItems.reduce(function(sum, r) { return sum + r.pageCount; }, 0);
    const totalWord = sharedRightItems.reduce(function(sum, r) { return sum + r.wordCount; }, 0);

    /* 상단 누적 통계 박스 */
    const infoDiv = document.createElement('div');
    infoDiv.style.cssText = 'padding:10px 12px 8px;border-bottom:1px solid #f5efe6;display:flex;flex-direction:row;gap:6px;flex-shrink:0;';

async function loadSharedTabMulti(recs) {

    /* 관리자 제외단어 수집 — 모든 rec의 excludeWords 합산 후 전역 저장 */
    const adminFilteredSet = new Set();
    recs.forEach(function(rec) {
        (rec.excludeWords || []).forEach(function(w) { adminFilteredSet.add(w.toLowerCase()); });
    });
    window._adminFilteredWords = adminFilteredSet;

        let mergedWsPages = [];
        let mergedOriginPages = [];

        for (const rec of recs) {

                const safeId = (rec.id || '').replace(/\//g, '_');

            }
            if (!tabData) tabData = rec;

            const rawWsPages = tabData.wsPages || rec.wsPages || [];

                /* 각 페이지 rows에서 제외단어가 en에 포함된 행 제거 */
                                            /* 각 페이지 rows에서 학생 제외단어 포함 행만 제거 */
                const filteredRows = (page.rows || []).filter(function(row) {
                    if (!row.en) return true; /* 영어 없는 행은 그대로 유지 */
                    const words = row.en.toLowerCase().split(/\s+/);
                    /* 학생 제외단어에 해당하면 해당 행 제거 */
                    return !words.some(function(w) { return excludedSet.has(w); });
                });
                /* 10칸 고정 — 빈칸 당기기 위해 10칸으로 맞춤 */
                while (filteredRows.length < 10) {
                    filteredRows.push({ en: '', kr: '', p: '' });
                }
                return Object.assign({}, page, { rows: filteredRows });
            });
                       mergedWsPages = mergedWsPages.concat(filteredWsPages);

            /* originPages 병합 — 원본 HTML이므로 필터링 없이 그대로 추가 */
            mergedOriginPages = mergedOriginPages.concat(tabData.originPages || rec.originPages || []);            /* fileName 병합 */
            const fNames = (tabData.fileName || rec.fileName || rec.label || '').split(',').map(function(f) { return f.trim(); }).filter(Boolean);
            mergedFileNames = mergedFileNames.concat(fNames);
        }

               /* 관리자 제외단어는 위에서 이미 전역 저장 완료 */

        /* 첫 번째 항목 기준으로 label/tag 설정 */
        const firstRec = recs[0];

        tabs.push({
            label: firstRec.tag || firstRec.label || '공용파일',

            wsCurrentPage: 0,
            originPages: mergedOriginPages,
            originCurrentPage: 0,
            savedId: null,
            tag: firstRec.tag || null,
            /* 병합된 파일명 전부 쉼표로 연결 */
            fileName: mergedFileNames.join(',')
        });

        currentTab = tabs.length - 1;
        wsPages = tabs[currentTab].wsPages;
        wsCurrentPage = 0;
        originPages = tabs[currentTab].originPages;
        originCurrentPage = 0;
        document.getElementById('wordSheetEmpty').style.display = 'none';
        document.getElementById('wordSheetInner').classList.add('open');
        document.getElementById('wordSheetWrap').style.alignItems = 'flex-start';
             compactWsPages(); /* 통계 계산 전 wsPages 먼저 정리 */
        if (originPages.length > 0) {
            document.getElementById('originSheetWrap').classList.add('open');
            document.getElementById('originStatBar').classList.add('open'); /* 파일 열 때 통계 바 표시 */
            positionOriginSheet();

            renderOriginPage();
            renderOriginDropdown();
        }
              saveTabsToLocal();
        renderWsSheet();
        renderTabBar();
    } catch(e) {

    }
}

function relocateRowByPage(fromPageIdx, fromRowIdx, targetP) {
    const movingRow = Object.assign({}, wsPages[fromPageIdx].rows[fromRowIdx]);

    // 현재 위치에서 제거
    wsPages[fromPageIdx].rows.splice(fromRowIdx, 1);

    // 제거 후 연쇄 당겨오기 — 같은 title 페이지 안에서만, 빈 자리에 당겨오기
    const fromTitle = wsPages[fromPageIdx].title;
    let pullFrom = fromPageIdx;
    let pullTo   = fromPageIdx + 1;
       while (pullTo < wsPages.length) {
        const prevPage = wsPages[pullFrom];
        const nextPage = wsPages[pullTo];
        if (nextPage.title !== fromTitle) break;
        /* prevPage에 실제 빈 자리가 있을 때만 당겨오기 실행 */
        const emptyIdx = prevPage.rows.findIndex(function(r) { return !r.en && !r.kr; });
        if (emptyIdx === -1) break;
        const firstFilledIdx = nextPage.rows.findIndex(function(r) { return r.en || r.kr; });
        if (firstFilledIdx === -1) break;
        /* 빈 자리에 다음 페이지 첫 단어 당겨오기 */
        prevPage.rows[emptyIdx] = nextPage.rows[firstFilledIdx];
        nextPage.rows.splice(firstFilledIdx, 1);
        while (prevPage.rows.length < 10) prevPage.rows.push({ en: '', kr: '', p: '' });
        while (nextPage.rows.length < 10) nextPage.rows.push({ en: '', kr: '', p: '' });
        if (!nextPage.rows.some(function(r) { return r.en || r.kr; })) {
            wsPages.splice(pullTo, 1);
            break;
        }
        pullFrom = pullTo;
        pullTo++;
    }
    while (wsPages[fromPageIdx].rows.length < 10) wsPages[fromPageIdx].rows.push({ en: '', kr: '', p: '' });
    wsPages[fromPageIdx].rows = wsPages[fromPageIdx].rows.slice(0, 10);
    // 같은 교재 페이지 번호(targetP)를 가진 행들 중 마지막 위치 찾기
    let insertPageIdx = -1;
    let insertRowIdx = -1;
    wsPages.forEach(function(wp, wi) {
        wp.rows.forEach(function(row, ri) {
            if (row.p && Number(row.p) === Number(targetP) && (row.en || row.kr)) {
                insertPageIdx = wi;
                insertRowIdx = ri;
            }
        });
    });

    // 완전 새 교재 페이지인 경우 — 마지막 내용 다음에 배치
    if (insertPageIdx === -1) {
        let lastContentPageIdx = 0;
        let lastContentRowIdx = -1;
        wsPages.forEach(function(wp, wi) {
            wp.rows.forEach(function(row, ri) {
                if (row.en || row.kr) {
                    lastContentPageIdx = wi;
                    lastContentRowIdx = ri;
                }
            });
        });
        insertPageIdx = lastContentPageIdx;
        insertRowIdx = lastContentRowIdx;

           }

    // 삽입 위치 다음에 끼워넣기
    insertRowIdx = insertRowIdx + 1;
    if (insertRowIdx >= 10) {
        insertPageIdx++;
        insertRowIdx = 0;
    }
    if (!wsPages[insertPageIdx]) {
        wsPages.push({ title: wsPages[insertPageIdx - 1].title, rows: Array.from({ length: 10 }, function() { return { en: '', kr: '', p: '' }; }) });
    }
    wsPages[insertPageIdx].rows.splice(insertRowIdx, 0, movingRow);

                      // 연쇄 밀기 — unshift 후 다음 페이지가 11개면 계속 밀기
    let overflowRow = null;
    /* 삽입 페이지가 10개 초과면 11번째 꺼내서 시작 */
    if (wsPages[insertPageIdx].rows.length > 10) {
        overflowRow = wsPages[insertPageIdx].rows.splice(10, 1)[0];
        while (wsPages[insertPageIdx].rows.length < 10) wsPages[insertPageIdx].rows.push({ en: '', kr: '', p: '' });
    }
    let ci = insertPageIdx + 1;
    while (overflowRow) {
        if (!wsPages[ci]) {
            /* 다음 페이지가 없으면 새 페이지 삽입 후 종료 */
            wsPages.push({ title: wsPages[ci - 1].title, rows: [overflowRow, ...Array.from({ length: 9 }, function() { return { en: '', kr: '', p: '' }; })] });
            overflowRow = null;
            break;
        }
        /* 다음 페이지 01자리에 끼워넣기 */
        wsPages[ci].rows.unshift(overflowRow);
        /* 다음 페이지가 11개면 11번째 꺼내서 다음 루프로 */
        if (wsPages[ci].rows.length > 10) {
            overflowRow = wsPages[ci].rows.splice(10, 1)[0];
            while (wsPages[ci].rows.length < 10) wsPages[ci].rows.push({ en: '', kr: '', p: '' });
        } else {
            overflowRow = null;
        }
        ci++;
    }

    // 연쇄 밀기 후 내용 없는 빈 페이지 제거
    for (let ci = wsPages.length - 1; ci > insertPageIdx; ci--) {
        if (!wsPages[ci].rows.some(function(r) { return r.en || r.kr; })) {
            wsPages.splice(ci, 1);
        }
    }

    // 이동 후 해당 페이지+줄로 화면 이동
    wsCurrentPage = insertPageIdx;
    wsScrollToRowIndex = insertRowIdx;
}/* 완료/취소 버튼 처리 함수 */

  function renderOriginPage() {
/* html 있거나 수동 추가(manual)인 것만 — 세 페이지(빈 페이지)는 제외 */
const validPages = originPages.filter(function(op) { return op.html || op.manual; });
        const page = validPages[originCurrentPage];
        /* manual 페이지는 내용 영역 건드리지 않고 바로 종료 */
        if (!page || page.manual) return;
                const area = document.getElementById('originContentArea');
        area.innerHTML = page.html || '';

        /* 모든 텍스트 노드에서 영어 단어 자동 span 처리 */
        wrapEnglishWords(area);

       renderOriginDropdown();
        applyOriginWordColors();
        updateOriginArrows();
        document.getElementById('originContentArea').addEventListener('scroll', updateOriginArrows);
    }

/* 텍스트 노드 순회 — 영어 단어 자동 span 감싸기 */
    function wrapEnglishWords(root) {
        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
                /* span[data-word] 안은 이미 처리됨 — 건너뜀 */
                if (node.parentElement && node.parentElement.dataset.word !== undefined) {
                    return NodeFilter.FILTER_REJECT;
                }
                /* script, style 태그 안은 건너뜀 */
                const tag = node.parentElement && node.parentElement.tagName;
                if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
                /* 영어 단어가 하나라도 있는 텍스트 노드만 처리 */
                return /[a-zA-Z]/.test(node.nodeValue)
                    ? NodeFilter.FILTER_ACCEPT
                    : NodeFilter.FILTER_SKIP;
            }
        });

        const nodes = [];
        let node;
        while ((node = walker.nextNode())) nodes.push(node);

        nodes.forEach(function(textNode) {
            const parts = textNode.nodeValue.split(/([a-zA-Z][a-zA-Z']*[a-zA-Z]|[a-zA-Z])/);
            if (parts.length <= 1) return;
            const frag = document.createDocumentFragment();
            parts.forEach(function(part) {
                if (/^[a-zA-Z][a-zA-Z']*[a-zA-Z]$|^[a-zA-Z]$/.test(part)) {
                    const span = document.createElement('span');
                    span.dataset.word = part.toLowerCase();
                    span.textContent = part;
                    frag.appendChild(span);
                } else {
                    frag.appendChild(document.createTextNode(part));
                }
            });
            textNode.parentNode.replaceChild(frag, textNode);
        });
    }

/* 좌측 원본창 단어 색 적용 */
   function applyOriginWordColors() {
        /* 우측에 반영된 단어 목록 + 페이지 인덱스 매핑 */
        const reflectedWords = new Set();
        const wordPageMap = {};
        wsPages.forEach(function(page, i) {
            page.rows.forEach(function(row) {
                if (row.en) {
                    row.en.split(/\s+/).forEach(function(w) {
                        const key = w.toLowerCase();
                        if (!key) return;
                        reflectedWords.add(key);
                        if (!(key in wordPageMap)) wordPageMap[key] = i;
                    });
                }
            });
        });

               /* 키워드 모달 제외 단어 목록 */
        const excludedWords = new Set(kwWords.map(function(w) { return w.toLowerCase(); }));

        /* 중복 단어 추적용 Map — 단어별 첫 번째 색 유형 저장 */
        const seenWords = new Map();

        /* 영어 단어만 있는 span[data-word] 에만 색 적용 */
        const spans = document.getElementById('originContentArea').querySelectorAll('span[data-word]');
        spans.forEach(function(span) {
            const word = (span.dataset.word || '').toLowerCase();

            /* 영어 알파벳 이외 문자 포함된 span은 무시 */
            if (!/^[a-z][a-z']*[a-z]$|^[a-z]$/i.test(word)) return;

            /* 이전 클릭 이벤트 중복 방지 — cloneNode로 교체 */
            const newSpan = span.cloneNode(true);
            span.parentNode.replaceChild(newSpan, span);

                       newSpan.style.borderRadius = '3px';
            newSpan.style.padding = '0 2px';
            newSpan.style.cursor = 'pointer';

            /* 중복 단어 처리 — 첫 번째 등장 시 색 유형 저장, 두 번째 이후 연한 색으로 표시 */
            if (seenWords.has(word)) {
                const firstColor = seenWords.get(word);
                if (firstColor === 'reflected') {
                    /* 반영 중복 — 연한 연두민트 */
                    newSpan.style.backgroundColor = '#cbffcb';
                    newSpan.title = '중복 단어 (반영)';

                    newSpan.title = '중복 단어 (관리자제외)';
                } else {
                    newSpan.style.backgroundColor = '';
                }
                return;
            }

                       /* 누락 모드일 때 — kr 빈 단어 빨간색 표시 */
            const isMissing = originMode === 'missing' &&
                originMissingList.some(function(m) { return m.word === word; });

            if (isMissing) {
                /* 누락 단어 — 빨간색 */
                newSpan.classList.add('origin-missing-word');
                newSpan.title = '누락 단어 (한국어 없음)';
                seenWords.set(word, 'missing');
            } else if (excludedWords.has(word)) {
                /* 사용자제외 단어 — 진한 노랑 */
                newSpan.style.backgroundColor = '#fde047';
                newSpan.title = '사용자 제외 단어';
                seenWords.set(word, 'userExcluded');
            } else if (reflectedWords.has(word)) {
                /* 반영된 단어 — 연두민트 */
                newSpan.style.backgroundColor = '#98e698';
                newSpan.title = '반영된 단어';
                seenWords.set(word, 'reflected');
            } else if (window._adminFilteredWords && window._adminFilteredWords.has(word)) {
                /* 관리자제외 단어 — 모스그린 연한색 + 검정 글자 */
                newSpan.style.backgroundColor = '#c4ccad';
                newSpan.style.color = '#111827';
                newSpan.style.fontWeight = '300';
                newSpan.title = '관리자 제외 단어';
                newSpan.style.cursor = 'default';
                seenWords.set(word, 'adminExcluded');
            } else {
                newSpan.style.backgroundColor = '';
                newSpan.style.color = '';
                newSpan.style.fontWeight = '';
                newSpan.style.cursor = 'default';
                seenWords.set(word, 'none');
            }

            /* 클릭 시 — 누락 모드면 우측 해당 행으로 이동, 아니면 기존 동작 */
            newSpan.addEventListener('click', function() {
                if (originMode === 'missing' && isMissing) {
                    /* 누락 단어 클릭 → 우측 해당 행으로 이동 */
                    const m = originMissingList.find(function(m) { return m.word === word; });
                    if (!m) return;

                if (!(word in wordPageMap)) return;
                const targetPage = wordPageMap[word];

        span.classList.remove('origin-missing-word', 'active');

/* ── 누락 단어 위치로 이동 ── */
function originMissingGoTo(i) {
    if (originMissingList.length === 0) return;
    originMissingCurrent = (i + originMissingList.length) % originMissingList.length;
    const cur = originMissingList[originMissingCurrent];
    originCurrentPage = cur.pageIdx;
    renderOriginPage();
    applyOriginWordColors();
    document.getElementById('originSearchListBtn').style.display = '';
    document.getElementById('originSearchListBtn').innerText =
        originMissingList.length + '/' + (originMissingCurrent + 1);
    setTimeout(function() {
        document.getElementById('originContentArea').querySelectorAll('span[data-word]').forEach(function(span) {
            span.classList.remove('active');
            if ((span.dataset.word || '') === cur.word && span.classList.contains('origin-missing-word')) {
                span.classList.add('active');
                span.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    }, 50);
}

(function() {

        const popup = document.getElementById('originImgPopup');

        const handle = document.getElementById('originImgResizeHandle');
        let dragX, dragY, dragging = false;
        let resizing = false, resizeStartX, resizeStartY, resizeStartW, resizeStartH;

        header.addEventListener('mousedown', function(e) {
            dragging = true;
            dragX = e.clientX - popup.offsetLeft;
            dragY = e.clientY - popup.offsetTop;
            e.preventDefault();
        });
        handle.addEventListener('mousedown', function(e) {
            resizing = true;
            resizeStartX = e.clientX;
            resizeStartY = e.clientY;
            resizeStartW = popup.offsetWidth;
            resizeStartH = popup.offsetHeight;
            e.preventDefault();
        });
       document.addEventListener('mousemove', function(e) {
            if (dragging) {
                const maxLeft = window.innerWidth - popup.offsetWidth;
                const maxTop = window.innerHeight - popup.offsetHeight;
                const newLeft = Math.min(Math.max(0, e.clientX - dragX), maxLeft);
                const newTop = Math.min(Math.max(0, e.clientY - dragY), maxTop);
                popup.style.left = newLeft + 'px';
                popup.style.top = newTop + 'px';
            }
           if (resizing) {
                const maxW = window.innerWidth - popup.offsetLeft;
                const maxH = window.innerHeight - popup.offsetTop;
                const newW = resizeStartW + (e.clientX - resizeStartX);
                const newH = resizeStartH + (e.clientY - resizeStartY);
                if (newW > 200 && newW <= maxW) popup.style.width = newW + 'px';
                if (newH > 160 && newH <= maxH) popup.style.height = newH + 'px';
            }
        });
       document.addEventListener('mouseup', function() {
            dragging = false;
            resizing = false;
        });

     /* 마우스 휠 확대/축소 */
        let imgScale = 1;
        let imgTransX = 0, imgTransY = 0;
        let imgDragging = false, imgDragStartX, imgDragStartY, imgDragOriginX, imgDragOriginY;
        const imgEl = document.getElementById('originImgPopupImg');
        const imgBody = document.getElementById('originImgPopupBody');

       function applyImgTransform() {
            if (imgScale <= 1) {
                imgEl.style.transform = '';
                imgTransX = 0;
                imgTransY = 0;
            } else {
                imgEl.style.transform = 'translate(' + imgTransX + 'px, ' + imgTransY + 'px) scale(' + imgScale + ')';
            }
        }

        popup.addEventListener('wheel', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (e.deltaY < 0) imgScale = Math.min(imgScale + 0.1, 5);
            else imgScale = Math.max(imgScale - 0.1, 1);
            applyImgTransform();
        }, { passive: false });

        /* 확대 시 이미지 드래그 이동 */
        imgBody.addEventListener('mousedown', function(e) {
            if (imgScale <= 1) return;
            imgDragging = true;
            imgDragStartX = e.clientX;
            imgDragStartY = e.clientY;
            imgDragOriginX = imgTransX;
            imgDragOriginY = imgTransY;
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!imgDragging) return;
            imgTransX = imgDragOriginX + (e.clientX - imgDragStartX);
            imgTransY = imgDragOriginY + (e.clientY - imgDragStartY);
            applyImgTransform();
        });
        document.addEventListener('mouseup', function() {
            imgDragging = false;
        });

        /* 팝업 열릴 때 scale/위치 초기화 */
        const observer = new MutationObserver(function() {
            if (popup.classList.contains('open')) {
                imgScale = 1;
                imgTransX = 0;
                imgTransY = 0;
                applyImgTransform();
            }
        });
        observer.observe(popup, { attributes: true, attributeFilter: ['class'] });
    });
})();

/* 커스텀 숫자 피커 */
function makeNumPicker(container, items, initVal, onChange) {
    let current = initVal;
    const SHOW = 1;
    let offset = 0; /* 현재 뷰의 시작 인덱스 */

    function getIdx() { return items.indexOf(current); }
    function render() {
        container.innerHTML = '';
        const idx = getIdx();
        /* offset 보정 */
        if (idx < offset) offset = idx;
        if (idx >= offset + SHOW) offset = idx - SHOW + 1;
        if (offset < 0) offset = 0;
        if (offset > items.length - SHOW) offset = Math.max(0, items.length - SHOW);

        /* 위 LED */
        const ledTop = document.createElement('div');
        ledTop.className = 'ws-num-led' + (offset > 0 ? ' active' : '');
        container.appendChild(ledTop);

        /* 아이템 3개 */
        const list = document.createElement('div');
        list.className = 'ws-num-list';
        for (let i = offset; i < offset + SHOW && i < items.length; i++) {
            const item = document.createElement('div');
            item.className = 'ws-num-item' + (items[i] === current ? ' selected' : '');
            item.innerText = items[i];
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                current = items[i];
                onChange(current);
                render();
            });
            list.appendChild(item);
        }
        container.appendChild(list);

        /* 아래 LED */
        const ledBot = document.createElement('div');
        ledBot.className = 'ws-num-led' + (offset + SHOW < items.length ? ' active' : '');
        container.appendChild(ledBot);
    }

    /* 마우스 휠 */
   container.addEventListener('wheel', function(e) {
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        const idx = getIdx();
        if (e.deltaY > 0 && idx < items.length - 1) { current = items[idx + 1]; onChange(current); }
        if (e.deltaY < 0 && idx > 0) { current = items[idx - 1]; onChange(current); }
        render();
    }, { passive: false });

    render();
    return {
        getValue: function() { return current; },
        setItems: function(newItems, newVal) {
            items = newItems;
            current = newVal !== undefined ? newVal : newItems[0];
            offset = 0;
            render();
        }
    };
}

function wsHideFillSelects(type) {
    const pfx = type === 'en' ? 'En' : 'Kr';
    const pageItems = wsPages.map(function(p, i) { return i + 1; });

    function getNoItems(pageIdx) {
        const page = wsPages[pageIdx];
        const count = page ? (page.rows || []).filter(function(r){ return r.en; }).length : 0;
        const arr = [];
        for (let i = 1; i <= count; i++) arr.push(i);
        return arr;
    }

    const spEl = document.getElementById('wsPicker' + pfx + 'StartPage');
    const snEl = document.getElementById('wsPicker' + pfx + 'StartNo');
    const epEl = document.getElementById('wsPicker' + pfx + 'EndPage');
    const enEl = document.getElementById('wsPicker' + pfx + 'EndNo');
    if (!spEl) return;

    const snPicker = makeNumPicker(snEl, getNoItems(0), 1, function(){});
    const enPicker = makeNumPicker(enEl, getNoItems(wsPages.length - 1), getNoItems(wsPages.length - 1).slice(-1)[0] || 1, function(){});

    makeNumPicker(spEl, pageItems, 1, function(val) {
        snPicker.setItems(getNoItems(val - 1), 1);
    });
    makeNumPicker(epEl, pageItems, pageItems[pageItems.length - 1], function(val) {
        const noItems = getNoItems(val - 1);
        enPicker.setItems(noItems, noItems[noItems.length - 1] || 1);
    });

    wsPickerInstances[type] = { spEl, snEl, epEl, enEl };
}

async function saveKwHistory(action, word) {
    if (!currentUser || !window._db) return;
    try {
        const col = fsCollection(db(), 'kw_history', currentUser.uid, 'logs');
        const now = new Date();
        const entry = {
            loginId: currentUser.displayName || currentUser.email || currentUser.uid,
            word: word,
            action: action,            // 'add' | 'delete'
            regAt: action === 'add'  ? now.toISOString() : null,
            delAt: action === 'delete' ? now.toISOString() : null,
            createdAt: now.toISOString()
        };
        await fsAddDoc(col, entry);
    } catch(e) {}
}

/* ── 이력 불러오기 ── */
async function loadHistWords() {
    histWords = [];
    if (!currentUser || !window._db) { renderHistAlpha(); renderHistList(); return; }
    try {
        const col = fsCollection(db(), 'kw_history', currentUser.uid, 'logs');
        const snap = await fsGetDocs(col);
        histWords = snap.docs.map(function(d) { return Object.assign({ _id: d.id }, d.data()); });
        histWords.sort(function(a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });
    } catch(e) {}
    histFilteredWords = histWords;
    renderHistAlpha();
    renderHistList();
}

function renderHistAlpha() {
    const alphas = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const visible = alphas.slice(histAlphaOffset, histAlphaOffset + HIST_ALPHA_VISIBLE);
    const container = document.getElementById('histAlphaList');
    if (!container) return;
    container.innerHTML = '';
    visible.forEach(function(a) {
        const hasWord = histFilteredWords.some(function(w) { return (w.word || '')[0].toUpperCase() === a; });
        const el = document.createElement('div');
        el.className = 'kw-alpha-item' +
            (a === histSelectedAlpha ? ' active' : '') +
            (hasWord ? ' has-word' : '');
        el.innerText = hasWord ? a + ' ' + histFilteredWords.filter(function(w){ return (w.word||'')[0].toUpperCase()===a; }).length : a;
        el.addEventListener('click', function() {
            histSelectedAlpha = a;
            histListOffset = 0;
            renderHistAlpha();
            renderHistList();
        });
        container.appendChild(el);
    });
    const up   = document.getElementById('histAlphaUp');
    const down = document.getElementById('histAlphaDown');
    if (up)   up.classList.toggle('hidden', histAlphaOffset === 0);
    if (down) down.classList.toggle('hidden', histAlphaOffset + HIST_ALPHA_VISIBLE >= alphas.length);

       function compactWsPages() {
        let pi = 0;
        while (pi < wsPages.length) {
            const groupTitle = wsPages[pi].title;

            // 같은 title 구간 끝 인덱스 찾기
            let pEnd = pi;
            while (pEnd + 1 < wsPages.length && wsPages[pEnd + 1].title === groupTitle) {
                pEnd++;
            }

            // 해당 구간 단어만 수집 (빈칸 제외)
            const allWords = [];
            for (let gi = pi; gi <= pEnd; gi++) {
                wsPages[gi].rows.forEach(function(r) {
                    if (r.en || r.kr) allWords.push({ en: r.en, kr: r.kr, p: r.p });
                });
            }

            // 기존 배열 내용을 직접 수정 (새 배열 교체 금지 — 참조 끊김 방지)
            let wi = 0;
            for (let gi = pi; gi <= pEnd; gi++) {
                for (let ri = 0; ri < 10; ri++) {
                    if (wi < allWords.length) {
                        // 기존 객체 내용 직접 덮어쓰기
                        wsPages[gi].rows[ri].en = allWords[wi].en;
                        wsPages[gi].rows[ri].kr = allWords[wi].kr;
                        wsPages[gi].rows[ri].p  = allWords[wi].p;
                        wi++;
                    } else {
                        // 남은 칸은 빈칸으로 직접 초기화
                        wsPages[gi].rows[ri].en = '';
                        wsPages[gi].rows[ri].kr = '';
                        wsPages[gi].rows[ri].p  = '';
                    }
                }
            }

                       // 완전히 빈 페이지 뒤에서부터 제거
            for (let gi = pEnd; gi > pi; gi--) {
                if (!wsPages[gi].rows.some(function(r) { return r.en || r.kr; })) {
                    wsPages.splice(gi, 1);
                }
            }

            // splice 후 실제 남은 그룹 마지막 인덱스 재계산해서 다음 그룹 시작점으로 이동
            let newPEnd = pi;
            while (newPEnd + 1 < wsPages.length && wsPages[newPEnd + 1].title === groupTitle) {
                newPEnd++;
            }
            pi = newPEnd + 1;
        }
    }

/* 파일명 파싱 — 앞숫자, 이름, 뒷숫자 분리 */
   function parseFileName(fileName) {    if (fileName.indexOf('#') !== -1) fileName = fileName.slice(fileName.indexOf('#') + 1); // 중1# 앞부분 제거
    const base = fileName.replace(/\.[^/.]+$/, '').replace(/\s*\(\d+\)$/, ''); // 확장자 + (1) 제거
    const slashIdx = base.indexOf('/');
    if (slashIdx !== -1) {
        const left = base.slice(0, slashIdx);
        const page = base.slice(slashIdx + 1).trim();
        const m = left.match(/^(\d+)(.+)$/);
        if (m) return { order: parseInt(m[1]), name: m[2], page: page };
        return { order: 0, name: left, page: page };
    }
    const m = base.match(/^(\d+)([^\d]+)(\d+)$/);
    if (!m) return { order: 0, name: base, page: '' };
    return { order: parseInt(m[1]), name: m[2], page: m[3] };
}

/* 파일명 → 이름부분 + 뒷숫자 분리 표시용 */
  function formatPageTitle(title) {
    if (title && title.indexOf('#') !== -1) title = title.slice(title.indexOf('#') + 1); // 중1# 앞부분 제거
    const base = (title || '').replace(/\.[^/.]+$/, '').replace(/\s*\(\d+\)$/, ''); // 확장자 + (1) 제거
    const slashIdx = base.indexOf('/');
    if (slashIdx !== -1) {
        const left = base.slice(0, slashIdx);
        const page = base.slice(slashIdx + 1).trim();
        const m = left.match(/^(\d+)(.+)$/);
        const name = m ? m[2].trim() : left.trim();
        return name + ' ' + page;
    }
    const m = base.match(/^(\d+)(.+?)(\d+)$/);
    if (m) return m[2].trim() + ' ' + m[3];
    return base;
}

/* 탭 닫기 */
async function closeTab(i) {
    const tab = tabs[i];
    if (!tab) return;

    /* 삭제/취소 선택 */
    const choice = await showTabCloseDialog(tab.label);
    if (choice === 'cancel') return;

    /* localStorage에서 해당 탭 제거 후 갱신 */
    tabs.splice(i, 1);
    saveTabsToLocal();
    if (tabs.length === 0) {
        currentTab = -1;
        wsPages = [];
        wsCurrentPage = 0;
        originPages = [];
        originCurrentPage = 0;
                       document.getElementById('wordSheetEmpty').style.display = '';
        document.getElementById('wordSheetInner').classList.remove('open');
        document.getElementById('originSheetWrap').classList.remove('open');
        document.getElementById('originStatBar').classList.remove('open'); /* 탭 전체 닫힐 때 통계 바도 숨김 */
        document.getElementById('originStatBar').classList.remove('open'); /* 탭 전체 닫힐 때 통계 바도 숨김 */
    } else {
        currentTab = Math.min(i, tabs.length - 1);

/* 탭 ID 생성 — 유저ID/날짜/시간/파일명 */
function makeTabId(tab) {
    const now = new Date();
    const date = now.getFullYear().toString().slice(2) +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0');
    const time = String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0');
    /* savedId가 있으면 재사용 — 없으면 최초 생성 후 탭에 기억 */
    if (!tab.savedId) {
        tab.savedId = `${currentUser.uid}/${date}/${time}/${tab.label}`;
    }
    return tab.savedId;
}window.closeTab = closeTab;

/* 새 페이지 완료 버튼 */
function wsNewPageOkClick() {
    /* 1. 제목 검증 */
    const titleVal = document.getElementById('wsNewPageTitleInput').value.trim();
    if (!titleVal) {
        alert('파일명(제목)을 입력하세요.');
        document.getElementById('wsNewPageTitleInput').focus();
        return;
    }

    /* 2. 입력된 행 수집 및 검증 */
    const newRows = [];
    for (let i = 0; i < 10; i++) {
        const en = document.getElementById('wsNewPageEn_' + i).value.trim();
        const kr = document.getElementById('wsNewPageKr_' + i).value.trim();
        const p  = document.getElementById('wsNewPageP_'  + i).value.trim();

        /* 셋 다 비어있으면 빈 줄로 간주 — 스킵 */
        if (!en && !kr && !p) continue;

        /* 하나라도 비어있으면 오류 */
        if (!en) { alert((i + 1) + '번 줄의 영어 단어를 입력하세요.'); document.getElementById('wsNewPageEn_' + i).focus(); return; }
        if (!kr) { alert((i + 1) + '번 줄의 한국어 뜻을 입력하세요.');  document.getElementById('wsNewPageKr_' + i).focus(); return; }
        if (!p)  { alert((i + 1) + '번 줄의 교재 페이지를 입력하세요.'); document.getElementById('wsNewPageP_'  + i).focus(); return; }

        newRows.push({ en: en, kr: kr, p: p });
    }

    /* 3. 단어 행이 1줄도 없으면 오류 */
    if (newRows.length === 0) {
        alert('단어를 1줄 이상 입력하세요.');
        document.getElementById('wsNewPageEn_0').focus();
        return;
    }

    /* 4. 새 페이지의 교재페이지 번호 — 첫 번째 행 기준 */
    const newPageNum = Number(newRows[0].p);

    /* 5. 기존 첫 번째 교재페이지 번호 구하기 */
    let firstExistingPageNum = null;
    for (let wi = 0; wi < wsPages.length; wi++) {
        for (let ri = 0; ri < wsPages[wi].rows.length; ri++) {
            const rp = wsPages[wi].rows[ri].p;
            if (rp) { firstExistingPageNum = Number(rp); break; }
        }
        if (firstExistingPageNum !== null) break;
    }

    /* 6. 10줄 고정 맞추기 */
    while (newRows.length < 10) newRows.push({ en: '', kr: '', p: '' });

    /* 7. 새 페이지 객체 생성 */
    const newWsPage = { title: titleVal, rows: newRows };

    /* 8. 위치 결정 및 삽입
          - 기존 페이지 없거나, 새 번호 ≤ 기존 첫 번호 → 맨 앞
          - 새 번호 > 기존 첫 번호 → 맨 뒤 */
    if (firstExistingPageNum === null || newPageNum <= firstExistingPageNum) {
        wsPages.unshift(newWsPage); /* 맨 앞 삽입 */
        wsCurrentPage = 0;
    } else {
        wsPages.push(newWsPage); /* 맨 뒤 삽입 */
        wsCurrentPage = wsPages.length - 1;
    }

 /* 9. originPages에도 추가 — 드롭다운 목록에 표시되게 */
    /* title을 파일명/교재페이지 형식으로 — 첫 번째 행 P값 자동 사용 */
    const originTitle = titleVal + (newRows[0].p ? '/' + newRows[0].p : '');
    /* 수동 추가 페이지임을 표시 — manual:true로 세 페이지와 구별 */
if (firstExistingPageNum === null || newPageNum <= firstExistingPageNum) {
    originPages.unshift({ title: originTitle, html: '', manual: true }); /* 맨 앞 삽입 */
} else {
    originPages.push({ title: originTitle, html: '', manual: true }); /* 맨 뒤 삽입 */
}

    /* 10. 마무리 */
    closeNewPageModal();
    savedTabs.delete(currentTab);

function recordScroll(dir) {
    const filterDate = document.getElementById('recordDateFilter').value;
    const filtered = _allRecords.filter(function(rec) {
        if (!filterDate) return true;
        const parts = (rec.id || '').split('/');
        const rawDate = parts[1] || '';
        const dispDate = rawDate.length === 6 ? '20' + rawDate.slice(0, 2) + '-' + rawDate.slice(2, 4) + '-' + rawDate.slice(4, 6) : '';
        return dispDate === filterDate;
    });
   if (filtered.length <= RECORD_VISIBLE) return;
    const sorted = _recordReverse ? filtered.slice() : filtered.slice().reverse();
    _recordOffset = Math.max(0, Math.min(_recordOffset + dir, sorted.length - RECORD_VISIBLE));
    renderRecordList();

    if (!rec) { alert('기록을 찾을 수 없습니다.'); return; }
   const alreadyExists = tabs.some(function(t) { return t.savedId === rec.id; }); /* 태그 기준 중복 체크 */
    if (alreadyExists) { alert('이미 열려있는 탭입니다.'); return; }
     tabs.push({
        label: rec.tag || rec.label, /* 태그를 label로 복원 */
        wsPages: rec.wsPages,
        wsCurrentPage: 0,
        originPages: rec.originPages || [],
        originCurrentPage: 0,
        savedId: rec.id || null,  /* 불러오기 시 id 복원 */
        tag: rec.tag || null      /* 불러오기 시 #태그 복원 */
    });

    currentTab = tabs.length - 1;

    document.getElementById('wordSheetEmpty').style.display = 'none';
